name: One-time seed assembly

# Runs once to assemble feed.xml from the _seed/part*.xml chunks that were
# pushed via the GitHub API (each chunk small enough to fit one API call),
# then deletes the _seed/ directory and this workflow file itself so it
# never runs again. Not part of the normal daily pipeline - see feed.yml
# for the real, ongoing daily rebuild.
on:
  push:
    paths:
      - "_seed/**"
      - ".github/workflows/assemble-seed.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble feed.xml from seed parts
        run: |
          cat _seed/part1.xml _seed/part2.xml _seed/part3.xml _seed/part4.xml _seed/part5.xml > feed.xml

      - name: Validate assembled feed.xml is well-formed XML
        run: python3 -c "import xml.etree.ElementTree as ET; t=ET.parse('feed.xml'); print('OK, items:', len(t.getroot().find('channel').findall('item')))"

      - name: Remove seed files and this one-time workflow
        run: |
          rm -rf _seed
          rm -f .github/workflows/assemble-seed.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: assemble feed.xml from seed parts, remove one-time assembly workflow"
          git push
