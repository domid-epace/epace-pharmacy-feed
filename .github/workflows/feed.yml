name: Rebuild product feed

on:
  schedule:
    # 07:00 UTC = 09:00 Prague time (CEST, summer DST).
    # After the winter DST switch (last Sunday of Oct) Prague is UTC+1, so
    # this same cron fires at 08:00 local time until DST resumes in spring.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate feed.xml
        env:
          SHOPIFY_SHOP: team-epace
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python3 generate_feed.py

      - name: Commit feed.xml if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- feed.xml; then
            echo "feed.xml unchanged - nothing to commit."
          else
            git add feed.xml
            git commit -m "Rebuild feed.xml ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
