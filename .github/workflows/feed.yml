name: Rebuild pharmacy product feed

# Runs daily at 07:00 UTC = 09:00 Europe/Prague during CEST (summer time).
# NOTE: Prague switches from CEST (UTC+2) to CET (UTC+1) on the last Sunday
# of October (2026-10-25). From that date until the next DST change in
# spring, 07:00 UTC will be 08:00 local time, not 09:00 - cron runs on a
# fixed UTC schedule and does not follow DST. Update the cron expression to
# "0 8 * * *" after the autumn 2026 DST switch if a wall-clock-accurate
# 09:00 Prague run matters past the hackathon.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check required secrets are set
        run: |
          missing=0
          if [ -z "${SHOPIFY_CLIENT_ID}" ]; then
            echo "::error::Repository secret SHOPIFY_CLIENT_ID is not set (Settings > Secrets and variables > Actions)."
            missing=1
          fi
          if [ -z "${SHOPIFY_CLIENT_SECRET}" ]; then
            echo "::error::Repository secret SHOPIFY_CLIENT_SECRET is not set (Settings > Secrets and variables > Actions)."
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "::error::Missing required secret(s) - see README.md 'One-time setup'. Aborting before calling Shopify."
            exit 1
          fi
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}

      - name: Generate feed.xml
        env:
          SHOPIFY_SHOP: team-epace
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python3 generate_feed.py

      - name: Commit and push feed.xml if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- feed.xml; then
            echo "feed.xml unchanged - nothing to commit."
          else
            git add feed.xml
            git commit -m "chore: daily feed refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
